name: build
on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/code-immortal/personal-site
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/checkout@v4
        if: github.ref == 'refs/heads/main'
        with:
          ref: deploy
          path: out

      - name: Publish manifests to deploy branch
        if: github.ref == 'refs/heads/main'
        run: |
          find out -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r deploy/. out/
          cd out
          kustomize edit set image ghcr.io/code-immortal/personal-site=ghcr.io/code-immortal/personal-site:sha-${{ github.sha }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${{ github.sha }}" || exit 0
          git pull --rebase
          git push